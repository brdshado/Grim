# %check_name% - name of the check
# %description% - description of the check
# %vl% - violations
# %verbose% - extra information
# %player% - player name
# [alert] - special command to alert
# [webhook] - special command to alert to discord webhook
# [proxy] - special command to alert to other servers connected to your proxy (BungeeCord/Velocity)
Punishments:
  Simulation:
    # After how many seconds should a violation be removed?
    remove-violations-after: 3600
    # This section will match all checks with the name,
    # To exclude a check that would otherwise be matched, put an exclamation mark in front of the name
    # For example, !BadPacketsN
    checks:
      - "Simulation"
      - "GroundSpoof"
      - "Timer"
      - "TimerLimit"
      - "NoFall"
    commands:
      - "100:0 kick %player% Movement Desync (1/3)"
      - "140:0 kick %player% Movement Desync (2/3)"
      - "180:0 kick %player% Movement Desync (3/3)"
      - "220:0 tempban %player% 1h Repeated Movement Violations"
      - "100:100 [webhook]"
      - "100:100 [proxy]"
  Knockback:
    remove-violations-after: 3600
    checks:
      - "Knockback"
      - "Explosion"
    commands:
      - "5:0 kick %player% Velocity Analysis (1/3)"
      - "15:0 kick %player% Velocity Analysis (2/3)"
      - "25:0 kick %player% Velocity Analysis (3/3)"
      - "35:0 tempban %player% 1h Vertical/Horizontal Velocity Hack"
      - "5:5 [alert]"
      - "5:5 [log]"
      - "20:20 [webhook]"
      - "20:20 [proxy]"
  Post:
