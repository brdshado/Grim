      - "40:0 kick %player% Interaction Processing (2/3)"
      - "60:0 kick %player% Interaction Processing (3/3)"
      - "80:0 tempban %player% 1h Post-Tick Interaction"
      - "20:20 [alert]"
      - "20:20 [log]"
      - "40:40 [webhook]"
      - "40:40 [proxy]"
  BadPackets:
